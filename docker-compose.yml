name: brewlite

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: brewlite-web
    command:
      - pnpm
      - --filter
      - web
      - dev
      - --host
      - 0.0.0.0
      - --port
      - "5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: brewlite-api
    command:
      - pnpm
      - --filter
      - api
      - start:dev
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://brewlite:brewlite@postgres:5432/brewlite
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    container_name: brewlite-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U brewlite -d brewlite
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  root_node_modules:
  web_node_modules:
  api_node_modules:
  postgres_data:
