name: brewlite

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: brewlite-web
    command:
      - pnpm
      - --filter
      - web
      - dev
      - --host
      - 0.0.0.0
      - --port
      - "5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: brewlite-api
    command:
      - pnpm
      - --filter
      - api
      - start:dev
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    environment:
      NODE_ENV: development
      REWARDS_TEST_PAYMENTS: ${REWARDS_TEST_PAYMENTS:-false}
      BANK_TRANSFER_DEMO_ENABLED: ${BANK_TRANSFER_DEMO_ENABLED:-false}
      CARD_DEMO_ENABLED: ${CARD_DEMO_ENABLED:-false}
      BANK_QR_BIN: ${BANK_QR_BIN:-}
      BANK_QR_BANK_NAME: ${BANK_QR_BANK_NAME:-}
      BANK_QR_ACCOUNT_NUMBER: ${BANK_QR_ACCOUNT_NUMBER:-}
      BANK_QR_ACCOUNT_NAME: ${BANK_QR_ACCOUNT_NAME:-}
      PORT: 3000
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:5173/payments/return}
      WEB_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATABASE_URL: postgresql://brewlite:brewlite@postgres:5432/brewlite
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    container_name: brewlite-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U brewlite -d brewlite
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  root_node_modules:
  web_node_modules:
  api_node_modules:
  postgres_data:
