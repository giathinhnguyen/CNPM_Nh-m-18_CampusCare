name: brewlite-production
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: brewlite
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://brewlite:${POSTGRES_PASSWORD}@postgres:5432/brewlite
      JWT_SECRET: ${JWT_SECRET:?Set a production JWT secret}
      WEB_ORIGIN: https://${BREWLITE_DOMAIN:-brewlitesguu.duckdns.org}
      GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set the Google client ID}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_API_IP: ${BREWLITE_PUBLIC_IP:-127.0.0.1}
      VNPAY_RETURN_URL: https://${BREWLITE_DOMAIN:-brewlitesguu.duckdns.org}/payments/return
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-}
      ZALOPAY_KEY1: ${ZALOPAY_KEY1:-}
      ZALOPAY_KEY2: ${ZALOPAY_KEY2:-}
      ZALOPAY_RETURN_URL: https://${BREWLITE_DOMAIN:-brewlitesguu.duckdns.org}/payments/zalopay/return
      ZALOPAY_CALLBACK_URL: https://${BREWLITE_DOMAIN:-brewlitesguu.duckdns.org}/api/payments/zalopay/callback
      BANK_TRANSFER_DEMO_ENABLED: "false"
      CARD_DEMO_ENABLED: "false"
      REWARDS_TEST_PAYMENTS: "false"
      DEPLOY_SEED_EMPTY_DATABASE: ${DEPLOY_SEED_EMPTY_DATABASE:-false}
      DEPLOY_ADMIN_EMAIL: ${DEPLOY_ADMIN_EMAIL:-}
      DEPLOY_ADMIN_PASSWORD: ${DEPLOY_ADMIN_PASSWORD:-}
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy && node dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 8
    restart: unless-stopped
    logging: *logging
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set the Google client ID}
    restart: unless-stopped
    logging: *logging
  caddy:
    image: caddy:2-alpine
    environment:
      BREWLITE_DOMAIN: ${BREWLITE_DOMAIN:-brewlitesguu.duckdns.org}
      BREWLITE_PUBLIC_IP: ${BREWLITE_PUBLIC_IP:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    logging: *logging
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
